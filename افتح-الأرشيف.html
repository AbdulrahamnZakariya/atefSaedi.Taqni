<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1b2430;--mute:#6b7280;--line:#e7e1d4;--navy:#16263b;--gold:#b08d4a;--gold2:#e9dcc0;--red:#b4433a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{background:var(--navy);color:#fff;padding:18px 18px 70px;position:relative}
header .top{display:flex;justify-content:space-between;align-items:center;max-width:980px;margin:auto}
header .brand b{display:block;font-size:20px;letter-spacing:.3px}
header .brand span{font-size:12px;color:#c9d2df}
header .home{font-size:13px;border:1px solid #ffffff33;border-radius:10px;padding:6px 12px}
.wrap{max-width:980px;margin:-52px auto 0;padding:0 14px 60px;position:relative}
.search{background:var(--card);border-radius:16px;box-shadow:0 6px 24px #16263b1a;display:flex;align-items:center;gap:10px;padding:12px 16px}
.search input{border:0;outline:0;font:inherit;font-size:16px;flex:1;background:transparent}
.search svg{flex:none;color:var(--gold)}
h2{font-size:18px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2 small{font-weight:400;color:var(--mute);font-size:13px}
.crumb{font-size:13px;color:var(--mute);margin:18px 0 0}
.crumb a{color:var(--gold);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.sec:hover{border-color:var(--gold);transform:translateY(-2px)}
.sec .ic{width:42px;height:42px;border-radius:12px;background:var(--gold2);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:18px}
.sec b{font-size:16px}
.sec span{font-size:13px;color:var(--mute)}
.sec .n{margin-top:auto;font-size:12px;color:var(--gold);font-weight:600}
.sec.lock .ic{background:#f3e3e1;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.list{display:flex;flex-direction:column;gap:8px}
.file{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.file:hover{border-color:var(--gold)}
.file .t{width:44px;height:44px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--navy);overflow:hidden}
.file .t img{width:100%;height:100%;object-fit:cover}
.file .t.pdf{background:#a63d32}.file .t.img{background:#3d7a5e}.file .t.vid{background:#5a4b8a}.file .t.aud{background:#b07a2a}.file .t.doc{background:#2c5d9b}.file .t.xls{background:#227447}
.file .m{flex:1;min-width:0}
.file .m b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .m span{font-size:12px;color:var(--mute)}
.tag{font-size:11px;background:var(--gold2);color:var(--navy);border-radius:6px;padding:1px 7px;margin-inline-start:4px}
.tag.warn{background:#f6e2c9;color:#8a5a12}
.about{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:14px}
.about dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:8px}
.about dt{color:var(--mute)}
.empty{color:var(--mute);font-size:14px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.viewer{position:fixed;inset:0;background:#0b1320ee;z-index:20;display:none;flex-direction:column}
.viewer.on{display:flex}
.viewer .bar{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:12px 16px;gap:10px}
.viewer .bar b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .bar .acts{display:flex;gap:8px;flex:none}
.viewer .bar a,.viewer .bar button{background:#ffffff1a;color:#fff;border:0;border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.viewer .body{flex:1;display:grid;place-items:center;padding:0 10px 10px;overflow:auto}
.viewer iframe{width:100%;height:100%;border:0;background:#fff;border-radius:8px}
.viewer img,.viewer video{max-width:100%;max-height:100%;border-radius:8px}
.viewer .meta{color:#c9d2df;font-size:12.5px;padding:0 16px 14px}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;max-width:360px;margin:20px auto}
.lockbox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin:12px 0;text-align:center}
.lockbox button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 20px;font:inherit;cursor:pointer}
footer{text-align:center;font-size:12px;color:var(--mute);margin-top:40px}
</style>
</head>

function help(){return crumb([['دليل الأرشيف']])+`<h2>دليل الأرشيف</h2><div class="about" style="line-height:2">
<b>لتلاقي ملف:</b><br>• اكتب أي كلمة بالبحث فوق: اسم مشروع، نوع ملف، اسم مستثمر، أو كلمة من اسم الملف.<br>• أو ادخل على القسم من الرئيسية، وبعدها اختار القسم الفرعي.<br>• كل مشروع إله صفحة فيها كل ملفاته مقسّمة: معماري، إنشائي، رخص، مالي...<br>• الملف الخاص بيفتح بكلمة سر منفصلة، وما بيظهر بالبحث قبل ما تفتحه.<br><br>
<b>الأقسام:</b><br>1. المكاتب الهندسية: مكتب فايد، م. عادل الحمادي. المساحات، الواجهات، الإنشائي، المعماري، الرخص والاعتمادات، المالي، الحقوق.<br>2. المشاريع: السقيا، الأعمدة، البدراني، الجصة.<br>3. المستثمرين: ملف لكل مستثمر.<br>4. العروض: أراضي، استثمار، مشاركة.<br>5. الملف الخاص.<br><br>
<b>تحويل لـ PDF:</b> أي ملف مش PDF (Word، Excel، صور، صفحات ويب) إله نسخة PDF جاهزة. اكبس على «PDF ⬇» جنب الملف، أو زر «نسخة PDF» لما تفتحه. الملف الأصلي بيضل زي ما هو بدون أي تغيير.<br><b>لما توصل ملفات جديدة:</b> ابعثها للمستشار التقني، وبتنضاف لحالها بقسمها، وبيتحدث الموقع والفهرس.<br>
<b>كل ملف إله رقم</b> (بيظهر لما تفتحه). لو بدك تصحح مكان ملف، احكي: «الملف f12 حطه بالسقيا، الرخص».</div>`}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function tryUnlock(){const v=$('#pw').value;if(await sha(v)===PRIV_HASH){unlocked=true;sessionStorageSet('kp','1');route()}else{$('#pwm').textContent='كلمة السر غلط'}}
function priv(){
 const sec=SECTIONS[4];
 if(!unlocked)return crumb([[sec.name]])+`<div class="lockbox"><b>🔒 الملف الخاص</b><p style="font-size:13px;color:var(--mute)">هذا القسم محمي بكلمة سر منفصلة</p><input id="pw" type="password" placeholder="كلمة السر" onkeydown="if(event.key==='Enter')tryUnlock()"><button onclick="tryUnlock()">فتح</button><p id="pwm" style="color:var(--red);font-size:13px;margin-top:8px"></p></div>`;
 return crumb([[sec.name]])+`<h2>الملف الخاص</h2>`+list(DATA.files.filter(f=>f.section==='priv'));
}
function search(q){
 const n=norm(q).split(/\s+/).filter(Boolean);
 const pool=unlocked?DATA.files:pub();
 const hits=pool.filter(f=>{const h=norm([f.title,f.sub,f.project,f.party,secName(f.section),f.note,f.path,f.kw].join(' '));return n.every(w=>h.includes(w))});
 return `<h2>نتائج البحث <small>${hits.length}</small></h2>`+list(hits,'ما لقيت إشي بهالكلمات');
}
function route(){
 const q=$('#q').value.trim();if(q){$('#app').innerHTML=search(q);return}
 const [s,a]=location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent);
 let h;
 if(!s)h=home();
 else if(s==='eng')h=subView(SECTIONS[0],ENG_SUBS.filter(x=>x!=='عام'||count(f=>f.section==='eng'&&f.sub==='عام')),'sub')(a);
 else if(s==='off')h=subView(SECTIONS[3],OFF_SUBS,'sub')(a);
 else if(s==='proj')h=a?entityPage(SECTIONS[1],DATA.projects.find(p=>p.name===a)||{name:a},'project'):entityList(SECTIONS[1],DATA.projects,'project');
 else if(s==='inv')h=a?entityPage(SECTIONS[2],DATA.investors.find(p=>p.name===a)||{name:a},'party'):entityList(SECTIONS[2],DATA.investors,'party');
 else if(s==='priv')h=priv();
 else if(s==='todo')h=crumb([['بحاجة تصنيف']])+`<h2>بحاجة تصنيف <small>${pub().filter(f=>f.section==='todo').length}</small></h2>`+list(pub().filter(f=>f.section==='todo'));
 else if(s==='help')h=help();
 else h=home();
 $('#app').innerHTML=h;window.scrollTo(0,0);
}
function openV(id){const f=DATA.files.find(x=>x.id===id);const [c]=typeOf(f);const u=enc(f.path);
 $('#vt').textContent=f.title;$('#vo').href=u;$('#vd').href=u;const vp=$('#vp');if(f.pdf){vp.style.display='';vp.href=enc(f.pdf);vp.textContent='نسخة PDF';vp.setAttribute('download','')}else if(c==='pdf'){vp.style.display='';vp.href=u;vp.textContent='PDF';vp.removeAttribute('download')}else{vp.style.display='none'}
 $('#vb').innerHTML=c==='pdf'?`<iframe src="${u}"></iframe>`:c==='img'?`<img src="${u}">`:c==='vid'?`<video src="${u}" controls></video>`:c==='aud'?`<audio src="${u}" controls></audio>`:`<a href="${u}" style="color:#fff">فتح الملف</a>`;
 $('#vm').textContent=['رقم '+f.id,secName(f.section),f.sub,f.project,f.party,f.date,f.note].filter(Boolean).join(' · ');
 $('#viewer').classList.add('on')}
function closeV(){$('#viewer').classList.remove('on');$('#vb').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeV()});
$('#q').addEventListener('input',route);window.addEventListener('hashchange',()=>{$('#q').value='';route()});route();
</script>
</body>
</html>
