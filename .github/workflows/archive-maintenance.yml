name: صيانة الأرشيف · كيانات
# 1) بعد الإدخال التلقائي (ingest.py): يرجّع تعديلات الوكيل إذا انمسحت، ويحدّث فهرس البحث بالمحتوى
# 2) كل يوم: يحذف نهائياً ملفات السلة اللي مر عليها 30 يوم
on:
  push:
    branches: [main]
    paths: ["index.html", "0-*/**", "1-*/**", "2-*/**", "3-*/**", "4-*/**", "_نسخ-PDF/**"]
  schedule:
    - cron: "0 1 * * *"        # 04:00 الرياض
  workflow_dispatch:
    inputs:
      task:
        description: "reconcile · purge · content · all"
        default: all
permissions:
  contents: write
concurrency: { group: archive-maintenance, cancel-in-progress: false }
jobs:
  maintain:
    if: "!startsWith(github.event.head_commit.message, 'صيانة الأرشيف')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: الأدوات
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pip install -q openpyxl python-docx
      - name: تشغيل
        env:
          EVENT: ${{ github.event_name }}
          TASK: ${{ inputs.task }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cd tools
          T="${TASK:-auto}"
          if [ "$EVENT" = "schedule" ]; then T=purge; fi
          if [ "$T" = "auto" ]; then
            case "$MSG" in "الوكيل:"*) T=content ;; *) T=reconcile+content ;; esac
          fi
          [ "$T" = "all" ] && T=reconcile+purge+content
          for t in $(echo "$T" | tr '+' ' '); do python3 maintain.py "$t"; done
      - name: حفظ
        run: |
          git config user.name "kayanat-bot"; git config user.email "kayanat-bot@users.noreply.github.com"
          git add -A index.html "فهرس-أرشيف-كيانات.xlsx" data/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "صيانة الأرشيف: تحديث تلقائي [skip wa]"
          git pull --rebase origin main && git push
